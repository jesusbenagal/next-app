version: "3.9"

name: padelpro

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: padelpro
    ports:
      - "5432:5432" # opcional, solo si quieres acceder desde el host
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d padelpro"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    # Abre http://localhost:8080 y usa:
    #   System: PostgreSQL
    #   Server: db
    #   Username: postgres
    #   Password: postgres
    #   Database: padelpro

volumes:
  pgdata:
  node_modules:
  pnpm-store:
